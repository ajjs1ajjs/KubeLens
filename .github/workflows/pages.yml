name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build web bundle + updater manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (web base = /KubeLens/)
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          owner: ajjs1ajjs
          repo: KubeLens
          tagName: ${{ github.ref_name }}
          releaseName: "KubeLens ${{ github.ref_name }}"
          releaseBody: "Auto-generated by pages.yml"
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
          createUpdaterArtifacts: false

      - name: Generate clean latest.json
        shell: bash
        run: |
          EXE=$(find release/bundle/nsis -name "*.exe" | head -1)
          echo "Found exe: $EXE"
          VER="${{ github.ref_name }}"
          # Remove leading 'v' if present
          VER="${VER#v}"
          SHA=$(sha256sum "$EXE" | cut -d' ' -f1)
          echo "Version: $VER"
          echo "SHA256: $SHA"
          cat > dist/latest.json << EOF
          {
            "version": "$VER",
            "platforms": {
              "windows-x86_64": {
                "signature": "",
                "tauri": "https://github.com/ajjs1ajjs/KubeLens/releases/download/${{ github.ref_name }}/$(basename $EXE)",
                "checksum": "sha256:$SHA"
              }
            }
          }
          EOF
          cat dist/latest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
