name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish (for example v0.2.2)"
        required: true
        default: "v0.2.2"

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify version sync (tag vs manifests)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag || github.ref_name }}"
          VER="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)"/\1/')
          echo "Tag: $TAG  expected version: $VER"
          echo "package.json: $PKG"
          echo "tauri.conf.json: $TAURI"
          echo "Cargo.toml: $CARGO"
          if [[ "$PKG" != "$VER" || "$TAURI" != "$VER" || "$CARGO" != "$VER" ]]; then
            echo "::error::Version mismatch: tag $TAG expects $VER but got pkg=$PKG tauri=$TAURI cargo=$CARGO"
            echo "Fix with: ./scripts/bump-version.ps1 $VER  (or ensure all three files match the tag)"
            exit 1
          fi
          if [[ "$PKG" != "$TAURI" || "$PKG" != "$CARGO" ]]; then
            echo "::error::Manifest versions out of sync: pkg=$PKG tauri=$TAURI cargo=$CARGO"
            exit 1
          fi
          echo "Version check passed: $VER"

      - name: Prepare signing key file
        # GitHub Secrets are UTF-8 strings. The Tauri updater plugin reads
        # `TAURI_SIGNING_PRIVATE_KEY` and decodes it as base64. If the secret
        # contains the raw key bytes (not the base64 text) the build fails
        # with "invalid utf-8 sequence". We write the secret to privkey.txt
        # and use it only for the manual signing step below, so the Tauri
        # build itself never touches the env var.
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > privkey.txt
          echo "Loaded signing key: $(wc -c < privkey.txt) bytes"

      - name: Disable updater artifacts for build (signed manually below)
        shell: bash
        run: |
          node -e "
            const fs=require('fs');
            const p='src-tauri/tauri.conf.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.bundle.createUpdaterArtifacts=false;
            fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');
            console.log('createUpdaterArtifacts disabled for release build');
          "

      - name: Build Tauri app
        # Intentionally NOT passing TAURI_SIGNING_PRIVATE_KEY here — the
        # build step does not need it because createUpdaterArtifacts is off
        # (set above). The installer is signed manually in the next step.
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Sign installer and create latest.json
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EXE=$(find src-tauri/target/release/bundle/nsis -name "*.exe" | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::No .exe found in nsis bundle output"
            exit 1
          fi
          echo "Found installer: $EXE"
          TAG="${{ inputs.release_tag || github.ref_name }}"
          VER="${TAG#v}"

          # Sign the installer. The signer writes the base64 signature to
          # `<file>.sig` next to the input file. Pass the password via env
          # (read by the CLI) and the key via --private-key-path; do NOT
          # also set TAURI_SIGNING_PRIVATE_KEY — it would collide with the
          # path flag and cause "cannot be used with --private-key".
          npx tauri signer sign --private-key-path privkey.txt "$EXE"
          SIG_FILE="${EXE}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "::error::Signature file not found: $SIG_FILE"
            exit 1
          fi
          # Strip any trailing whitespace/newline from the signature.
          SIG=$(tr -d '\r\n' < "$SIG_FILE")
          echo "Signature: $SIG"

          SHA=$(sha256sum "$EXE" | cut -d' ' -f1)
          echo "Version: $VER"
          echo "SHA256: $SHA"

          cat > latest.json << EOF
          {
            "version": "$VER",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG",
                "url": "https://github.com/ajjs1ajjs/KubeLens/releases/download/$TAG/$(basename $EXE)",
                "checksum": "sha256:$SHA"
              }
            }
          }
          EOF
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: KubeLens ${{ inputs.release_tag || github.ref_name }}
          body: |
            See the [changelog](https://github.com/ajjs1ajjs/KubeLens/releases) for details.
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
