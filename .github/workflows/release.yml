name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish (for example v0.3.6)"
        required: true
        default: "v0.3.6"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            platform: windows-latest
            args: --bundles nsis --config {"bundle":{"createUpdaterArtifacts":true}}
          - name: Ubuntu (x64)
            platform: ubuntu-22.04
            args: --bundles deb,appimage --config {"bundle":{"createUpdaterArtifacts":true}}
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --bundles dmg --config {"bundle":{"createUpdaterArtifacts":true}}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Verify version sync (tag vs manifests)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag || github.ref_name }}"
          VER="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)"/\1/')
          echo "Tag: $TAG  expected version: $VER"
          echo "package.json: $PKG"
          echo "tauri.conf.json: $TAURI"
          echo "Cargo.toml: $CARGO"
          if [[ "$PKG" != "$VER" || "$TAURI" != "$VER" || "$CARGO" != "$VER" ]]; then
            echo "::error::Version mismatch: tag $TAG expects $VER but got pkg=$PKG tauri=$TAURI cargo=$CARGO"
            echo "Fix with: ./scripts/bump-version.ps1 $VER  (or ensure all three files match the tag)"
            exit 1
          fi
          if [[ "$PKG" != "$TAURI" || "$PKG" != "$CARGO" ]]; then
            echo "::error::Manifest versions out of sync: pkg=$PKG tauri=$TAURI cargo=$CARGO"
            exit 1
          fi
          echo "Version check passed: $VER"

      - name: Check updater signing key is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set. The in-app updater requires signed artifacts — add the minisign private key to repository secrets."
            exit 1
          fi

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-macos
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: artifacts

      - name: Create latest.json (all platforms)
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          node <<'NODEEOF'
          const fs = require('fs');
          const path = require('path');
          const tag = process.env.TAG;
          const version = tag.replace(/^v/, '');
          const dir = 'artifacts';

          const pick = (label, re) => {
            const file = fs.readdirSync(dir).find((n) => re.test(n));
            if (!file) throw new Error(`Missing ${label} artifact matching ${re}`);
            return file;
          };
          const sigOf = (name) =>
            fs.readFileSync(path.join(dir, name + '.sig'), 'utf8').replace(/\s+/g, '');
          const url = (name) =>
            `https://github.com/ajjs1ajjs/KubeLens/releases/download/${tag}/${name}`;

          const win = pick('Windows NSIS installer', /^KubeLens_.*_x64-setup\.exe$/);
          const linux = pick('Linux AppImage', /^KubeLens_.*_amd64\.AppImage$/);
          const macos = pick('macOS updater bundle', /^KubeLens_.*_aarch64\.app\.tar\.gz$/);

          const latest = {
            version,
            platforms: {
              'windows-x86_64': { signature: sigOf(win), url: url(win) },
              'linux-x86_64': { signature: sigOf(linux), url: url(linux) },
              'darwin-aarch64': { signature: sigOf(macos), url: url(macos) },
            },
          };
          fs.writeFileSync('latest.json', JSON.stringify(latest, null, 2) + '\n');
          console.log(fs.readFileSync('latest.json', 'utf8'));
          NODEEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: KubeLens ${{ inputs.release_tag || github.ref_name }}
          body: |
            Installers: Windows (NSIS), Ubuntu (deb + AppImage), macOS Apple Silicon (dmg).

            The app checks for updates on startup and installs them in place — no manual download needed.
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            artifacts/*
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
