name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish (for example v0.3.6)"
        required: true
        default: "v0.3.6"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            platform: windows-2025
            args: --bundles nsis --config src-tauri/updater-ci.conf.json
          - name: Ubuntu (x64)
            platform: ubuntu-22.04
            args: --bundles deb,appimage --config src-tauri/updater-ci.conf.json
          - name: macOS (Apple Silicon)
            platform: macos-15
            args: --bundles app,dmg --config src-tauri/updater-ci.conf.json
          - name: macOS (Intel)
            platform: macos-15-intel
            args: --bundles app,dmg --config src-tauri/updater-ci.conf.json
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: npm ci

      - name: Verify version sync (tag vs manifests)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag || github.ref_name }}"
          VER="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)"/\1/')
          PLIST=$(node -p "require('fs').readFileSync('src-tauri/Info.plist','utf8').match(/<key>CFBundleShortVersionString<\/key>\s*<string>([^<]+)<\/string>/)[1]")
          echo "Tag: $TAG  expected version: $VER"
          echo "package.json: $PKG"
          echo "tauri.conf.json: $TAURI"
          echo "Cargo.toml: $CARGO"
          echo "Info.plist: $PLIST"
          if [[ "$PKG" != "$VER" || "$TAURI" != "$VER" || "$CARGO" != "$VER" || "$PLIST" != "$VER" ]]; then
            echo "::error::Version mismatch: tag $TAG expects $VER but got pkg=$PKG tauri=$TAURI cargo=$CARGO plist=$PLIST"
            echo "Fix with: ./scripts/bump-version.ps1 $VER  (or ensure all manifests match the tag)"
            exit 1
          fi
          if [[ "$PKG" != "$TAURI" || "$PKG" != "$CARGO" || "$PKG" != "$PLIST" ]]; then
            echo "::error::Manifest versions out of sync: pkg=$PKG tauri=$TAURI cargo=$CARGO plist=$PLIST"
            exit 1
          fi
          echo "Version check passed: $VER"

      - name: Check updater signing key is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set. The in-app updater requires signed artifacts — add the minisign private key to repository secrets."
            exit 1
          fi

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-2025'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

      - name: Upload macOS Apple Silicon artifacts
        if: matrix.platform == 'macos-15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-macos-arm64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload macOS Intel artifacts
        if: matrix.platform == 'macos-15-intel'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-macos-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    environment: production
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release-files
          find artifacts -type f -exec mv {} release-files/ \;
          ls -la release-files

      - name: Create latest.json (all platforms)
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          node <<'NODEEOF'
          const fs = require('fs');
          const path = require('path');
          const tag = process.env.TAG;
          const version = tag.replace(/^v/, '');
          const dir = 'release-files';

          const pick = (label, re) => {
            const file = fs.readdirSync(dir).find((n) => re.test(n));
            if (!file) {
              throw new Error(
                `Missing ${label} matching ${re}. Available: ${fs.readdirSync(dir).join(', ')}`,
              );
            }
            return file;
          };
          const sigOf = (name) =>
            fs.readFileSync(path.join(dir, name + '.sig'), 'utf8').replace(/\s+/g, '');
          const url = (name) =>
            `https://github.com/ajjs1ajjs/KubeLens/releases/download/${tag}/${name}`;

          const win = pick('Windows NSIS installer', /x64-setup\.exe$/i);
          const linux = pick('Linux AppImage', /amd64\.AppImage$/i);
          const macosArm = pick('macOS Apple Silicon updater bundle', /aarch64.*app\.tar\.gz$/i);
          const macosIntel = pick('macOS Intel updater bundle', /x86_64.*app\.tar\.gz$/i);

          const latest = {
            version,
            platforms: {
              'windows-x86_64': { signature: sigOf(win), url: url(win) },
              'linux-x86_64': { signature: sigOf(linux), url: url(linux) },
              'darwin-aarch64': { signature: sigOf(macosArm), url: url(macosArm) },
              'darwin-x86_64': { signature: sigOf(macosIntel), url: url(macosIntel) },
            },
          };
          fs.writeFileSync('latest.json', JSON.stringify(latest, null, 2) + '\n');
          console.log(fs.readFileSync('latest.json', 'utf8'));
          NODEEOF

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "release-files/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: KubeLens ${{ inputs.release_tag || github.ref_name }}
          body: |
            Installers: Windows (NSIS), Ubuntu (deb + AppImage), macOS Apple Silicon (dmg), macOS Intel (dmg).

            The app checks for updates on startup and installs them in place — no manual download needed.
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            release-files/*
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
