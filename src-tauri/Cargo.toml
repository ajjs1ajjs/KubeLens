[package]
name = "kubelens"
version = "0.2.5"
description = "A modern, lightweight Kubernetes IDE"
authors = ["KubeLens"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kubelens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is deprecated/archived upstream; serde-yaml-ng is a drop-in
# maintained fork exposed here under the same crate name
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
kube = { version = "4.0.0", features = ["runtime", "ws", "oidc"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
prost = { version = "0.14", features = ["derive"] }
flate2 = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
